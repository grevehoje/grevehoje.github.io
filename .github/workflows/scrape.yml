name: Scrape strike data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: server
        run: pnpm run scrape
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/data/status.json
          git diff --cached --quiet || git commit -m "Update strike data"
          git push
      - name: Update data on gh-pages (live site)
        run: |
          cp client/public/data/status.json /tmp/status.json
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          mkdir -p data
          cp /tmp/status.json data/status.json
          git add data/status.json
          git diff --cached --quiet || git commit -m "Update strike data"
          git push origin gh-pages
