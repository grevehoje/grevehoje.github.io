<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreveHoje.pt - Mockup</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666666;
            --card-bg: #f5f5f5;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #f59e0b;
            --border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --text: #ffffff;
                --subtext: #a1a1aa;
                --card-bg: #1a1a1a;
                --border: #27272a;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; }
        .logo span { color: var(--red); }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 600px;
        }

        .status-badge {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 16px;
        }

        .status-red { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 2px solid var(--red); }
        .status-green { background: rgba(34, 197, 94, 0.1); color: var(--green); border: 2px solid var(--green); }

        .operators {
            width: 100%;
            max-width: 600px;
            display: grid;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .card-info p { font-size: 0.9rem; color: var(--subtext); }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .ad-slot {
            width: 100%;
            max-width: 600px;
            height: 100px;
            background: var(--card-bg);
            border: 1px dashed var(--subtext);
            margin: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--subtext);
            font-size: 0.8rem;
            border-radius: 8px;
        }

        footer {
            margin-top: auto;
            padding: 40px 0;
            font-size: 0.8rem;
            color: var(--subtext);
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Greve<span>Hoje</span></div>
        <button class="theme-toggle">🌓</button>
    </header>

    <main class="hero">
        <div class="status-badge status-red">HÁ GREVES HOJE</div>
        <h1>Transportes em Portugal</h1>
        <p style="color: var(--subtext); margin-top: 8px;">Sábado, 30 de Maio</p>
    </main>

    <section class="operators">
        <div class="card">
            <div class="card-info">
                <h3>CP - Comboios de Portugal</h3>
                <p>Greve parcial. Supressões previstas.</p>
            </div>
            <div class="indicator" style="background: var(--red);"></div>
        </div>
        <div class="card">
            <div class="card-info">
                <h3>Metro de Lisboa</h3>
                <p>Circulação normal.</p>
            </div>
            <div class="indicator" style="background: var(--green);"></div>
        </div>
        <div class="card">
            <div class="card-info">
                <h3>Fertagus</h3>
                <p>Possíveis atrasos.</p>
            </div>
            <div class="indicator" style="background: var(--yellow);"></div>
        </div>
    </section>

    <footer style="margin-bottom: 80px;">
        &copy; 2026 GreveHoje.pt • Dados informativos.
    </footer>

    <div class="sticky-anchor">
        <div class="ad-content">ESPAÇO PUBLICITÁRIO (STICKY)</div>
        <button onclick="this.parentElement.remove()" style="position: absolute; top: -10px; right: 10px; background: #000; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px;">×</button>
    </div>

    <style>
        .sticky-anchor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .ad-content {
            color: var(--subtext);
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</body>
</html>
